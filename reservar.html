<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Caseta · Reservar Plaza</title>
  <meta name="description" content="La Caseta — Reserva tu plaza para la Edición V · 4 de Julio de 2026." />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logos/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-dark);
      color: var(--color-ivory);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .res-header {
      width: 100%;
      padding: 2rem 2rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .res-back {
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-gold);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 200ms;
    }
    .res-back:hover { opacity: 1; }

    /* ── Main card ── */
    .res-card {
      width: 100%;
      max-width: 560px;
      padding: 3rem 2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .res-logo {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-gold);
      margin-bottom: 0.25rem;
    }

    .res-edition {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gold);
      opacity: 0.6;
      margin-bottom: 2.5rem;
    }

    .gold-line {
      width: 40px;
      height: 1px;
      background: var(--color-gold);
      opacity: 0.4;
      margin: 0 auto 2.5rem;
    }

    /* Event details */
    .res-details {
      margin-bottom: 3rem;
    }
    .res-details-title {
      font-family: var(--font-display);
      font-size: 2.6rem;
      font-weight: 600;
      color: var(--color-ivory);
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .res-details-meta {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-gold);
      opacity: 0.75;
      line-height: 2;
    }

    /* Form */
    .res-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .res-form label {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-gold);
      opacity: 0.7;
      display: block;
      text-align: left;
      margin-bottom: 0.4rem;
    }

    .res-form input {
      width: 100%;
      background: rgba(212, 180, 131, 0.06);
      border: 1px solid rgba(212, 180, 131, 0.25);
      border-radius: 2px;
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 300;
      color: var(--color-ivory);
      outline: none;
      transition: border-color 200ms;
    }
    .res-form input::placeholder { color: rgba(248, 246, 241, 0.3); }
    .res-form input:focus { border-color: rgba(212, 180, 131, 0.6); }

    .btn-reservar {
      width: 100%;
      padding: 1rem;
      background: var(--color-gold);
      color: var(--color-dark);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 200ms;
    }
    .btn-reservar:hover { opacity: 0.85; }
    .btn-reservar:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Post-submit state */
    .res-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
    }
    .res-success.visible { display: flex; }

    .success-msg {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-ivory);
      text-align: center;
    }
    .success-sub {
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--color-gold);
      opacity: 0.65;
      text-align: center;
    }

    .btn-calendar {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.8rem;
      border: 1px solid rgba(212, 180, 131, 0.4);
      border-radius: 2px;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-gold);
      text-decoration: none;
      transition: background 200ms, border-color 200ms;
    }
    .btn-calendar:hover {
      background: rgba(212, 180, 131, 0.08);
      border-color: rgba(212, 180, 131, 0.7);
    }
    .btn-calendar svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      flex-shrink: 0;
    }

    .res-footer {
      padding: 2rem;
      font-family: var(--font-body);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--color-gray);
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header class="res-header">
    <a href="index.html" class="res-back">← Volver al inicio</a>
  </header>

  <main class="res-card">

    <p class="res-logo">La Caseta</p>
    <p class="res-edition">Annual Summer Edition</p>
    <div class="gold-line"></div>

    <div class="res-details">
      <h1 class="res-details-title">Edición V · 2026</h1>
      <p class="res-details-meta">
        4 de Julio de 2026<br>
        Masía L'Alboret
      </p>
    </div>

    <form class="res-form" id="reservaForm" novalidate>
      <div>
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Tu nombre y apellido"
          autocomplete="name"
          required
        />
      </div>
      <button type="submit" class="btn-reservar">Reservar Plaza</button>
    </form>

    <div class="res-success" id="resSuccess">
      <p class="success-msg" id="successMsg"></p>
      <p class="success-sub">Tu invitación se ha descargado automáticamente.</p>
      <a
        class="btn-calendar"
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=La+Caseta+V+%C2%B7+2026&dates=20260704T180000/20260705T060000&details=Edici%C3%B3n+V+de+La+Caseta&location=Mas%C3%ADa+L%27Alboret"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
        </svg>
        Añadir a Google Calendar
      </a>
    </div>

  </main>

  <footer class="res-footer">© 2026 · La Caseta · Annual Summer Edition</footer>

  <script>
    const form = document.getElementById('reservaForm');
    const success = document.getElementById('resSuccess');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) {
        document.getElementById('nombre').focus();
        return;
      }
      generateInvitation(nombre);
      successMsg.textContent = `Bienvenido/a, ${nombre}.`;
      form.style.display = 'none';
      success.classList.add('visible');
    });

    function generateInvitation(nombre) {
      const W = 1200, H = 800;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Background — dark navy gradient
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#111827');
      bg.addColorStop(1, '#1F2937');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Subtle corner ornament lines
      const gold = '#D4B483';
      const goldDim = 'rgba(212,180,131,0.2)';

      ctx.strokeStyle = goldDim;
      ctx.lineWidth = 1;
      // Top-left corner
      ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(160, 60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(60, 160); ctx.stroke();
      // Top-right corner
      ctx.beginPath(); ctx.moveTo(W-60, 60); ctx.lineTo(W-160, 60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-60, 60); ctx.lineTo(W-60, 160); ctx.stroke();
      // Bottom-left corner
      ctx.beginPath(); ctx.moveTo(60, H-60); ctx.lineTo(160, H-60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60, H-60); ctx.lineTo(60, H-160); ctx.stroke();
      // Bottom-right corner
      ctx.beginPath(); ctx.moveTo(W-60, H-60); ctx.lineTo(W-160, H-60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-60, H-60); ctx.lineTo(W-60, H-160); ctx.stroke();

      // Top gold rule
      ctx.strokeStyle = goldDim;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(120, 110); ctx.lineTo(W-120, 110); ctx.stroke();

      // "LA CASETA" logotype
      ctx.fillStyle = gold;
      ctx.font = '500 14px Inter, sans-serif';
      ctx.letterSpacing = '0.25em';
      ctx.textAlign = 'center';
      ctx.fillText('LA CASETA', W/2, 90);

      // Edition label
      ctx.fillStyle = 'rgba(212,180,131,0.55)';
      ctx.font = '400 11px Inter, sans-serif';
      ctx.letterSpacing = '0.2em';
      ctx.fillText('ANNUAL SUMMER EDITION', W/2, 145);

      // Centre divider line
      ctx.strokeStyle = goldDim;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W/2-30, 165); ctx.lineTo(W/2+30, 165); ctx.stroke();

      // "INVITACIÓN" label
      ctx.fillStyle = 'rgba(212,180,131,0.45)';
      ctx.font = '400 10px Inter, sans-serif';
      ctx.letterSpacing = '0.3em';
      ctx.fillText('INVITACIÓN', W/2, 210);

      // Guest name
      ctx.fillStyle = '#F8F6F1';
      ctx.font = 'italic 600 72px "Cormorant Garamond", Georgia, serif';
      ctx.letterSpacing = '0.02em';
      ctx.fillText(nombre, W/2, 320);

      // Thin gold line under name
      ctx.strokeStyle = 'rgba(212,180,131,0.35)';
      ctx.lineWidth = 1;
      const nameWidth = Math.min(ctx.measureText(nombre).width + 80, W - 240);
      ctx.beginPath();
      ctx.moveTo(W/2 - nameWidth/2, 345);
      ctx.lineTo(W/2 + nameWidth/2, 345);
      ctx.stroke();

      // Edition title
      ctx.fillStyle = gold;
      ctx.font = '600 36px "Cormorant Garamond", Georgia, serif';
      ctx.letterSpacing = '0.06em';
      ctx.fillText('Edición V · 2026', W/2, 420);

      // Date & Location
      ctx.fillStyle = 'rgba(248,246,241,0.7)';
      ctx.font = '300 15px Inter, sans-serif';
      ctx.letterSpacing = '0.1em';
      ctx.fillText('4 DE JULIO DE 2026', W/2, 475);

      ctx.fillStyle = 'rgba(212,180,131,0.6)';
      ctx.font = '300 13px Inter, sans-serif';
      ctx.letterSpacing = '0.12em';
      ctx.fillText("MASÍA L'ALBORET", W/2, 510);

      // Bottom rule
      ctx.strokeStyle = goldDim;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(120, H-110); ctx.lineTo(W-120, H-110); ctx.stroke();

      // Footer text
      ctx.fillStyle = 'rgba(212,180,131,0.3)';
      ctx.font = '300 10px Inter, sans-serif';
      ctx.letterSpacing = '0.18em';
      ctx.fillText('© 2026 · LA CASETA · ANNUAL SUMMER EDITION', W/2, H-80);

      // Download
      const link = document.createElement('a');
      link.download = `invitacion-la-caseta-2026-${nombre.replace(/\s+/g, '-').toLowerCase()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>

</body>
</html>
